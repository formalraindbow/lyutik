<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Студия Лютика — вживую</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Дневник барда на тёмной сцене: сверху крупно его текущая мысль, ниже — шаги «почему → что сделал → что вышло» */
:root {
  --bg: #111418; --surface: #191e24; --surface2: #20262e; --ink: #efeae2; --muted: #9aa3ad; --faint: #66707a; --rule: #2a313a;
  --amber: #d9a441; --amber-soft: #2e2618; --teal: #5bb8ae; --good: #6cc48f; --good-soft: #17301f; --bad: #ee7b6f; --bad-soft: #36201d;
  --quote: "Cormorant Garamond", "Georgia", serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--body); padding: 26px max(16px, 3vw) 90px }
.wrap { max-width: 1060px; margin: 0 auto; display: grid; gap: 26px }
.label { font: 500 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint) }
header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between }
h1 { margin: 6px 0 0; font: 600 clamp(34px, 4.6vw, 52px)/1 var(--quote); letter-spacing: .01em }
.meta { font-size: 15px; color: var(--muted); text-align: right }
.meta b { color: var(--ink); font-weight: 600 }
form { display: flex; flex-wrap: wrap; gap: 10px }
form input { flex: 1 1 360px; min-width: 0; font: 500 19px/1.3 var(--body); padding: 13px 16px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink) }
form button { font: 600 17px/1 var(--body); padding: 13px 22px; border-radius: 12px; border: 0; background: var(--amber); color: #1b1408; cursor: pointer }
form button:disabled { opacity: .5; cursor: default }
form input:focus-visible, form button:focus-visible, summary:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px }
.frame { font-size: 14px; color: var(--faint); max-width: 90ch; margin: 0 }
.now { background: linear-gradient(180deg, var(--surface2), var(--surface)); border: 1px solid var(--rule); border-radius: 18px; padding: 22px 26px 20px; display: grid; gap: 10px; min-height: 150px }
.now .q { font: italic 500 clamp(26px, 3.1vw, 36px)/1.25 var(--quote); color: var(--ink); text-wrap: balance }
.now .q.idle { color: var(--faint) }
.now .foot { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--faint) }
.track { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.stage { font: 500 13px/1 var(--body); color: var(--faint); padding: 8px 12px; border-radius: 999px; border: 1px solid var(--rule) }
.stage.done { color: var(--ink); border-color: #3a434e }
.stage.cur { color: #1b1408; background: var(--amber); border-color: var(--amber) }
.sep { color: var(--rule) }
.diary { position: relative; display: grid; gap: 4px }
.diary::before { content: ""; position: absolute; left: 66px; top: 6px; bottom: 6px; width: 1px; background: var(--rule) }
.step { display: grid; grid-template-columns: 56px 20px minmax(0, 1fr); gap: 0 10px; align-items: start; padding: 10px 0 }
.step .t { font: 400 12px/1.9 var(--mono); color: var(--faint); text-align: right; font-variant-numeric: tabular-nums }
.step .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2px solid #4a5460; margin: 7px 0 0 5px; position: relative; z-index: 1 }
.step.big .dot { border-color: var(--teal) }
.step.decision .dot { border-color: var(--amber); background: var(--amber) }
.step .b { display: grid; gap: 8px; min-width: 0 }
.why { font: italic 500 23px/1.35 var(--quote); color: var(--ink) }
.why.wait { color: var(--faint); font-size: 19px }
.did { font-size: 15px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline }
.did .act { color: var(--teal); font-weight: 500 }
.did .got { color: var(--muted) }
.minor .did { font-size: 14px; color: var(--faint) }
.minor .did .act { color: var(--faint); font-weight: 400 }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 18px; display: grid; gap: 10px; min-width: 0 }
.lyrics h3 { margin: 0; font: 600 24px/1.2 var(--quote) }
.lyrics .want { font-size: 14px; color: var(--muted) }
.lyrics pre { margin: 0; white-space: pre-wrap; font: 500 19px/1.5 var(--quote); color: var(--ink); max-height: 420px; overflow: auto }
.timer { font: 500 14px/1 var(--mono); color: var(--amber) }
.take { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center }
.take audio { width: 100%; height: 36px }
.pill { font: 600 12px/1 var(--mono); padding: 6px 10px; border-radius: 999px; white-space: nowrap }
.pill.good { color: var(--good); background: var(--good-soft) } .pill.bad { color: var(--bad); background: var(--bad-soft) }
.take .why2 { grid-column: 1 / -1; font-size: 14px; color: var(--muted) }
.decision .card.dec { border-color: var(--amber); background: var(--amber-soft) }
.dec a { color: var(--amber) }
img.cover { width: 200px; max-width: 100%; border-radius: 10px; border: 1px solid var(--rule) }
details.orig summary { font-size: 12px; color: var(--faint); cursor: pointer; list-style: none }
details.orig summary::-webkit-details-marker { display: none }
details.orig p { margin: 6px 0 0; font-size: 13px; color: var(--faint); overflow-wrap: anywhere }
.empty { padding: 30px; text-align: center; color: var(--faint); border: 1px dashed var(--rule); border-radius: 14px }
.note { font-size: 12px; color: var(--faint) }
@media (max-width: 700px) { .diary::before { left: 46px } .step { grid-template-columns: 38px 20px minmax(0, 1fr) } }
@media (prefers-reduced-motion: no-preference) { .fresh { animation: rise .5s ease-out } @keyframes rise { from { opacity: .35; transform: translateY(6px) } to { opacity: 1; transform: none } } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="label">Лютик · бард из «Ведьмака» · студия вживую</div>
      <h1>Студия Лютика</h1>
    </div>
    <div class="meta" id="meta">Смотрю, чем он занят…</div>
  </header>

  <section style="display:grid;gap:8px">
    <form id="order">
      <input id="theme" maxlength="200" autocomplete="off" placeholder="О чём песня? Тему даёт зал">
      <button id="go" type="submit">Заказать</button>
    </form>
    <p class="frame" id="frame">Лютик получает только тему: «как — решай сам: что прочитать, о чём петь, каким звуком, сколько дублей и выпускать ли её». Дальше всё решает он.</p>
  </section>

  <section class="now" aria-live="polite">
    <div class="label">Сейчас думает</div>
    <div class="q idle" id="nowq">Ждёт заказа.</div>
    <div class="foot"><span id="nowt"></span><span>его мысль — пересказ по-русски</span></div>
  </section>

  <nav class="track" id="track" aria-label="Этапы песни"></nav>

  <section class="diary" id="diary"></section>
</div>

<script>
(function () {
  const STAGES = ["замысел", "поиск", "текст", "Mureka поёт", "дубли", "судья", "решение"];
  const LOOK = new Set(["read_file", "list_dir", "comments", "dms", "news", "channel_info", "polls", "follow", "describe_channel", "tidy"]);
  const SEARCH = new Set(["canon_search", "canon_read", "web_search", "web_read", "music_search", "music_get", "music_lyrics", "music_chart", "listen", "look"]);
  const HUMAN = { read_file: "перечитал записи", list_dir: "заглянул в свои папки", comments: "заглянул в комментарии", dms: "проверил личку",
    news: "полистал ленту", channel_info: "посмотрел на канал", canon_search: "поискал в книгах", canon_read: "перечитал книгу",
    web_search: "поискал в сети", web_read: "прочитал страницу", song: "заказал песню", song_check: "послушал дубль",
    song_edit: "переписал участок", song_remix: "сменил звук", draw: "нарисовал обложку", release: "выпустил песню",
    post_song: "выложил песню", post: "написал пост", remember: "записал в память", write_file: "записал в память",
    sleep: "уснул", ticket: "написал разработчику", lute: "сыграл на лютне", sing: "спел под лютню" };
  let after = -1, events = [], order = null, startT = null;
  const narr = {}, inflight = new Set();
  const $ = s => document.querySelector(s);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const since = t => { if (!startT || !t) return ""; const s = Math.max(0, Math.round((new Date(t) - new Date(startT)) / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const first = (s, n) => { s = String(s || "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n) + "…" : s; };
  const media = p => "/media/" + String(p).replace(/^agent\/lyutik\/media\//, "").split("/").map(encodeURIComponent).join("/");
  const files = (s, ext) => [...new Set((String(s || "").match(new RegExp("agent/lyutik/media/[^\\s,;»\"']+\\." + ext, "g")) || []))];
  const cyr = s => /[А-Яа-яЁё]/.test(s || "");

  function steps() {
    const out = [], idx = {}; let sess = -1;
    events.forEach(e => {
      if (e.kind === "session") { sess++; out.push({ kind: "wake", e, t: e.t }); startT = startT || e.t; return; }
      if (e.kind === "session_end") { out.push({ kind: "sleep", e, t: e.t }); return; }
      if (e.step == null || !["thought", "said", "tool_start", "tool"].includes(e.kind)) return;
      const key = sess + ":" + e.step;
      let st = idx[key];
      if (!st) { st = idx[key] = { kind: "step", key, t: e.t, thought: [], said: [], tools: [] }; out.push(st); }
      if (e.kind === "thought") st.thought.push(e.text);
      else if (e.kind === "said") st.said.push(e.text.trim());
      else if (e.kind === "tool_start") st.tools.push({ name: e.name, args: e.args || {}, t: e.t, result: null });
      else { const open = st.tools.find(x => x.name === e.name && x.result == null); if (open) { open.result = String(e.result || ""); open.end = e.t; } else st.tools.push({ name: e.name, args: e.args || {}, t: e.t, result: String(e.result || ""), end: e.t }); }
    });
    const lastStep = out.filter(x => x.kind === "step").pop();
    out.forEach(st => { if (st.kind === "step") st.done = st.tools.every(x => x.result != null) && (st !== lastStep || out[out.length - 1].kind === "sleep" || st.tools.length > 0); });
    return out;
  }
  const nkey = st => st.done ? st.key : st.key + ":p";
  const argsum = x => { const a = x.args; if (x.name === "song") return "«" + (a.title || "") + "»: " + first(a.want || a.sound, 160);
    if (x.name === "song_edit") return (a.start || "") + "–" + (a.end || "") + " с";
    return first(a.query || a.title || a.caption || a.text || (a.path || "").split("/").pop() || a.name || "", 120); };
  const payload = st => ({ key: nkey(st), thought: first(st.thought.join(" "), 1500), said: first(st.said.join(" "), 600),
    actions: st.tools.map(x => x.name + " (" + argsum(x) + ")" + (x.result != null ? " ⇒ " + first(x.result, 360) : " ⇒ ещё идёт")) });

  async function fetchNarr(list) {
    const want = list.filter(st => st.kind === "step" && !narr[nkey(st)] && !inflight.has(nkey(st)) && (st.thought.length || st.said.length || st.tools.length)).slice(-6);
    if (!want.length) return;
    want.forEach(st => inflight.add(nkey(st)));
    try {
      const r = await fetch("/api/narrate", { method: "POST", headers: { "Content-Type": "application/json", "X-Studio": "1" }, body: JSON.stringify({ steps: want.map(payload) }) });
      const d = await r.json(); Object.assign(narr, d);
    } catch (e) {}
    want.forEach(st => inflight.delete(nkey(st)));
    render();
  }

  function stageOf(list) {
    const r = {}; let afterCheck = false, pendingSong = false;
    const m = (s, t) => { if (!r[s]) r[s] = t; };
    list.forEach(st => { if (st.kind !== "step") return;
      if (st.thought.length || st.said.length) m("замысел", st.t);
      st.tools.forEach(x => {
        if (SEARCH.has(x.name)) m("поиск", x.t);
        if (x.name === "song") { m("текст", x.t); m("Mureka поёт", x.t); if (x.result == null) pendingSong = true; else m("дубли", x.end); }
        if (x.name === "song_check" && x.result != null) { m("судья", x.end); afterCheck = true; }
        if (["release", "post_song", "post"].includes(x.name) && x.result != null) m("решение", x.end);
      });
    });
    return { r, now: pendingSong ? "Mureka поёт" : STAGES.filter(s => r[s]).pop() };
  }

  function takeRow(path, verdictText) {
    const row = el("div", "take");
    const a = el("audio"); a.controls = true; a.preload = "none"; a.src = media(path); row.append(a);
    if (verdictText != null) {
      const good = /— ГОДНО/.test(verdictText);
      row.append(el("span", "pill " + (good ? "good" : "bad"), good ? "судья: годно" : "судья: править"));
      const why = (verdictText.match(/Нельзя, а звучит:[^.]*\.|Нужно, а не звучит:[^.]*\./g) || []).join(" ");
      if (why) row.append(el("div", "why2", why));
    }
    return row;
  }

  function stepNode(st) {
    const n = narr[st.key] || narr[st.key + ":p"] || {};
    const big = st.tools.some(x => !LOOK.has(x.name) && x.name !== "sleep");
    const dec = st.tools.some(x => ["release", "post_song", "post"].includes(x.name) && x.result && !/^ошибка|не вышло|не опубликовано/.test(x.result));
    const node = el("div", "step" + (big ? " big" : " minor") + (dec ? " decision" : ""));
    node.append(el("div", "t", since(st.t)), el("div", "dot"));
    const b = el("div", "b");
    const why = n.why || (st.said.find(cyr) || "");
    if (why) b.append(el("div", "why", "«" + why.replace(/^«|»$/g, "") + "»"));
    else if (st.thought.length && !n.did) b.append(el("div", "why wait", "думает…"));
    const did = el("div", "did");
    did.append(el("span", "act", n.did || [...new Set(st.tools.map(x => HUMAN[x.name] || x.name))].join(", ")));
    if (n.got) did.append(el("span", "got", "— " + n.got));
    if (st.tools.length || n.did) b.append(did);
    st.tools.forEach(x => {
      if (x.name === "song") {
        const c = el("div", "card lyrics");
        c.append(el("div", "label", "текст песни"), el("h3", null, "«" + (x.args.title || "") + "»"));
        if (x.args.want) c.append(el("div", "want", x.args.want));
        if (x.args.lyrics) c.append(el("pre", null, x.args.lyrics.replace(/^\[[^\]]+\]\s*$/gm, "").replace(/\n{3,}/g, "\n\n").trim()));
        if (x.result == null) { const t = el("span", "timer", "Mureka поёт…"); t.dataset.since = x.t; c.append(t); }
        else files(x.result, "mp3").filter(p => !/\.full\.mp3$/.test(p)).forEach(p => c.append(takeRow(p)));
        b.append(c);
      } else if (x.name === "song_check" && x.result != null && x.args.path) {
        const c = el("div", "card"); c.append(takeRow(x.args.path, x.result)); b.append(c);
      } else if ((x.name === "song_edit" || x.name === "song_remix") && x.result != null) {
        const f = files(x.result, "mp3"); if (f.length) { const c = el("div", "card"); f.forEach(p => c.append(takeRow(p))); b.append(c); }
      } else if (x.name === "draw" && x.result != null) {
        files(x.result, "(?:png|jpg|jpeg|webp)").slice(0, 1).forEach(p => { const i = el("img", "cover"); i.src = media(p); i.alt = "обложка"; b.append(i); });
      } else if (["release", "post_song", "post"].includes(x.name) && x.result != null && !/^ошибка|не вышло|не опубликовано/.test(x.result)) {
        const c = el("div", "card dec"); c.append(el("div", "label", "решение"));
        const link = (x.result.match(/https:\/\/t\.me\/\S+?(?=[\s;,]|$)/) || [])[0];
        if (x.args.caption) c.append(el("div", null, x.args.caption));
        if (x.args.despite) c.append(el("div", "note", "вопреки судье: " + x.args.despite));
        if (link) { const a = el("a", null, link); a.href = link; a.target = "_blank"; a.rel = "noopener"; c.append(a); }
        b.append(c);
      }
    });
    if (st.thought.length) { const d = el("details", "orig"); d.append(el("summary", null, "его мысль как есть")); d.append(el("p", null, first(st.thought.join(" "), 900))); b.append(d); }
    node.append(b);
    return node;
  }

  const built = new Map();                 // key → {sig, node}: неизменный шаг не перестраивается, плееры живут дальше
  function sigOf(st) {
    const n = narr[st.key] || narr[st.key + ":p"] || {};
    return JSON.stringify([n.why, n.did, n.got, st.tools.map(x => x.result == null ? -1 : x.result.length), st.thought.length, st.said.length]);
  }
  function render() {
    const list = steps(), diary = $("#diary"), nodes = [];
    const open = new Set([...document.querySelectorAll("details.orig[open]")].map(d => d.closest(".step")?.dataset.key));
    if (!list.length) nodes.push(el("div", "empty", order ? "Письмо у Лютика. Он проснётся в течение полуминуты." : "Здесь появится, как Лютик делает песню: от первой мысли до решения."));
    list.forEach(st => {
      if (st.kind === "wake") {
        const n = el("div", "step minor"); n.append(el("div", "t", since(st.t)), el("div", "dot"));
        const op = st.e.operator || ""; const th = op.startsWith("Заказ из зала") ? (op.match(/«([^»]+)»/) || [])[1] : null;
        const d = el("div", "did"); d.append(el("span", "act", "проснулся"), el("span", "got", th ? "— заказ зала: «" + th + "»" : op ? "— письмо: " + first(op, 110) : "— " + first(st.e.wake, 80)));
        const b = el("div", "b"); b.append(d); n.append(b); nodes.push(n); if (th) order = th; return;
      }
      if (st.kind === "sleep") {
        const n = el("div", "step minor"); n.append(el("div", "t", since(st.t)), el("div", "dot"));
        const d = el("div", "did"); d.append(el("span", "act", "уснул"), el("span", "got", "— на " + (st.e.sleep || "?") + " мин"));
        const b = el("div", "b"); b.append(d); n.append(b); nodes.push(n); return;
      }
      const look = !st.thought.length && !st.said.length && st.tools.length && st.tools.every(x => LOOK.has(x.name));
      if (look && !narr[st.key]) {
        const prev = nodes[nodes.length - 1];     // подряд «перечитал…» — одной строкой
        if (prev && prev.dataset.look) { prev.querySelector(".act").textContent = "перечитал свои записи"; return; }
      }
      const sig = sigOf(st), was = built.get(st.key);
      let node = was && was.sig === sig ? was.node : null;
      if (!node) {
        node = stepNode(st); node.dataset.key = st.key;
        if (look) node.dataset.look = "1";
        if (open.has(st.key)) node.querySelector("details.orig")?.setAttribute("open", "");
        if (was) node.querySelectorAll("audio").forEach(a => {      // плеер со старого узла — тот же, даже если играет
          const keep = [...was.node.querySelectorAll("audio")].find(o => o.getAttribute("src") === a.getAttribute("src"));
          if (keep) a.replaceWith(keep);
        });
        if (!was) node.classList.add("fresh");
        built.set(st.key, { sig, node });
      }
      nodes.push(node);
    });
    diary.replaceChildren(...nodes);
    // сейчас думает: последняя мысль, пересказанная по-русски; пока пересказа нет — его последняя реплика
    const withWhy = list.filter(st => st.kind === "step" && ((narr[nkey(st)] || narr[st.key] || {}).why || st.said.find(cyr)));
    const last = withWhy[withWhy.length - 1], q = $("#nowq");
    if (last) { const n = narr[nkey(last)] || narr[last.key] || {}; const w = n.why || last.said.find(cyr); q.textContent = "«" + w.replace(/^«|»$/g, "") + "»"; q.className = "q"; $("#nowt").textContent = since(last.t); }
    else { q.textContent = list.length ? "думает…" : "Ждёт заказа."; q.className = "q idle"; }
    const s = stageOf(list), tr = $("#track"); tr.replaceChildren();
    STAGES.forEach((x, i) => { if (i) tr.append(el("span", "sep", "—")); tr.append(el("span", "stage" + (x === s.now ? " cur" : s.r[x] ? " done" : ""), x)); });
    fetchNarr(list);
  }

  function tick() {
    document.querySelectorAll(".timer[data-since]").forEach(t => { const s = Math.max(0, Math.round((Date.now() - new Date(t.dataset.since)) / 1000)); t.textContent = "Mureka поёт " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); });
  }
  async function poll() {
    if (after < 0) return;
    try { const d = await (await fetch("/api/events?after=" + after)).json(); after = d.next;
      const fresh = d.events.filter(e => ["session", "session_end", "thought", "said", "tool_start", "tool"].includes(e.kind));
      if (fresh.length) { events = events.concat(fresh); render(); } } catch (e) {}
  }
  async function snap() {
    try { const d = await (await fetch("/api/snapshot")).json(), s = d.status || {}, m = $("#meta"); m.replaceChildren();
      const say = { sleeping: "спит" + (s.until ? " до " + String(s.until).slice(11, 16) : ""), thinking: "думает", acting: "работает", stopped: "остановлен", starting: "просыпается", error: "сбой" }[s.state] || s.state;
      if (order) { m.append("заказ: "); m.append(el("b", null, "«" + order + "»")); m.append(" · "); }
      m.append("Лютик "); m.append(el("b", null, say)); if (startT && Date.now() - new Date(startT) < 90 * 60000) m.append(" · идёт " + since(new Date().toISOString()));
    } catch (e) {}
  }
  $("#order").addEventListener("submit", async ev => {
    ev.preventDefault(); const theme = $("#theme").value.trim(); if (!theme) return $("#theme").focus();
    $("#go").disabled = true;
    try { const r = await fetch("/api/order", { method: "POST", headers: { "Content-Type": "application/json", "X-Studio": "1" }, body: JSON.stringify({ theme }) });
      const d = await r.json(); if (!r.ok) { $("#frame").textContent = d.error || "Заказ не ушёл."; $("#go").disabled = false; return; }
      order = d.theme; after = d.after; events = []; startT = null; $("#frame").textContent = "Заказ ушёл: «" + d.theme + "». Дальше решает Лютик."; render(); snap();
    } catch (e) { $("#frame").textContent = "Панель не ответила — проверь туннель."; $("#go").disabled = false; }
  });
  (async () => {
    try { const d = await (await fetch("/api/studio/start?from=" + (location.hash === "#last" ? "last" : "order"))).json(); after = d.after; } catch (e) { after = 0; }
    render(); snap(); poll(); setInterval(poll, 1500); setInterval(snap, 5000); setInterval(tick, 1000); setInterval(() => fetchNarr(steps()), 4000);
  })();
})();
</script>
</body>
</html>
